<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LMS - Login</title>
    <link rel="stylesheet" href="/css/theme.css" />
</head>

<!-- data-bg="waves" -> effects.js draws the full-page line waves background -->
<body class="auth" data-bg="waves">

    <div class="auth-page">

        <div class="auth-brand">
            <h1>📚 LMS</h1>
            <p>Learn. Build. Grow.</p>
        </div>

        <!-- transparent card on the RIGHT - the waves stay visible through it -->
        <form id="loginForm" class="auth-card">
            <h2>Welcome back</h2>

            <!-- JS writes error/success text in here -->
            <p id="loginAlert"></p>

            <label>Email</label>
            <input type="email" id="loginEmail" required />

            <label>Password</label>
            <input type="password" id="loginPassword" required />

            <button type="submit" class="w-100">Login</button>

            <a href="/forgot-password.html" class="auth-link">Forgot password?</a>
        </form>

    </div>

    <script src="/js/fx/effects.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/login.js"></script>

</body>
</html>
