<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LMS - Forgot Password</title>
    <link rel="stylesheet" href="/css/theme.css" />
</head>

<body class="auth" data-bg="waves">

    <div class="auth-page">

        <div class="auth-brand">
            <h1>📚 LMS</h1>
            <p>We will email you a reset link.</p>
        </div>

        <form id="forgotForm" class="auth-card">
            <h2>Forgot password</h2>

            <div id="pageAlert" class="d-none"></div>

            <label>Email</label>
            <input type="email" id="forgotEmail" placeholder="Your email" required />

            <button type="submit" class="w-100">Send reset link</button>

            <a href="/index.html" class="auth-link">&larr; Back to login</a>
        </form>

    </div>

    <script src="/js/fx/effects.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/forgot-password.js"></script>
</body>
</html>
