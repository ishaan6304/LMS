<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LMS - Assign Courses (Instructor)</title>
    <link rel="stylesheet" href="/css/theme.css" />
</head>
<body>

    <div id="navbar"></div>

    <h1>Assign Courses</h1>

    <div class="border-glow-card form-card mb-4">
        <h2>Assign Course to Student</h2>
        <p id="assignAlert"></p>

        <form id="assignForm">
            <label>Student</label>
            <select id="assignStudent" required></select>

            <label>Course (only your courses appear here)</label>
            <select id="assignCourse" required></select>

            <button type="submit">Assign Course</button>
        </form>
    </div>

    <script src="/js/fx/effects.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/instructor/assign.js"></script>
</body>
</html>
