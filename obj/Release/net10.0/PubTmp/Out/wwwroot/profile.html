<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LMS - My Profile</title>
    <link rel="stylesheet" href="/css/theme.css" />
</head>
<body>

    <div id="navbar"></div>

    <h1>My Profile</h1>

    <div class="border-glow-card form-card mb-4">
        <h2>Profile Details</h2>
        <p id="profileAlert"></p>

        <form id="profileForm">
            <label>Email (read-only)</label>
            <input type="email" id="profileEmail" disabled />

            <label>First Name</label>
            <input type="text" id="profileFirstName" required />

            <label>Last Name</label>
            <input type="text" id="profileLastName" required />

            <button type="submit">Save Profile</button>
        </form>
    </div>

    <div class="border-glow-card form-card mb-4">
        <h2>Change Password</h2>
        <p id="passwordAlert"></p>

        <form id="passwordForm">
            <label>Current Password</label>
            <input type="password" id="currentPassword" required />

            <label>New Password</label>
            <input type="password" id="newPassword" required />

            <button type="submit">Change Password</button>
        </form>
    </div>

    <script src="/js/fx/effects.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/profile.js"></script>
</body>
</html>
