<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LMS - Reset Password</title>
    <link rel="stylesheet" href="/css/theme.css" />
</head>

<body class="auth" data-bg="waves">

    <div class="auth-page">

        <div class="auth-brand">
            <h1>📚 LMS</h1>
            <p>Choose a new password.</p>
        </div>

        <form id="resetForm" class="auth-card">
            <h2>Set a new password</h2>

            <div id="pageAlert" class="d-none"></div>

            <label>New password</label>
            <input type="password" id="newPassword" placeholder="New password" required />

            <button type="submit" class="w-100">Change password</button>
        </form>

    </div>

    <script src="/js/fx/effects.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/reset-password.js"></script>
</body>
</html>
