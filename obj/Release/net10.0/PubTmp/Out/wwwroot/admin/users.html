<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LMS - All Users (Admin)</title>
    <link rel="stylesheet" href="/css/theme.css" />
</head>
<body>

    <div id="navbar"></div>

    <div class="page-header">
        <h1>All Users</h1>
        <a class="btn" href="/admin/create-user.html">+ Create New User</a>
    </div>

    <div class="d-flex align-items-center gap-2 mb-3">
        <label class="mb-0 mt-0" style="margin: 0;">Show role:</label>
        <!-- filled by JS with the dynamic role list -->
        <select id="userListRole" class="w-auto">
            <option>Instructor</option>
            <option>Student</option>
        </select>
    </div>

    <div class="border-glow-card">
        <table>
            <thead>
                <tr><th>Name</th><th>Email</th><th>Role</th></tr>
            </thead>
            <tbody id="usersTableBody"></tbody>
        </table>
    </div>

    <script src="/js/fx/effects.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/admin/users.js"></script>
</body>
</html>
